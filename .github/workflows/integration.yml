# Manual, credentialed Supabase integration test (tests/test_supabase_integration.py).
# Runs ONLY when someone with write access starts it from the Actions tab. It has no
# pull_request / pull_request_target / push trigger, so fork PRs can never reach these secrets.
# Secrets live in the GitHub *Environment* named below, which should require a reviewer and be
# restricted to the main branch (Settings -> Environments). Use a SEPARATE test Supabase project.
name: Supabase integration (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm: writes and then deletes prediction rows in the TEST project'
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-integration     # never two runs against the same test project at once
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ inputs.confirm == 'run' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            ui/requirements.txt
            requirements-dev.txt
      - name: Install CPU-only PyTorch (same pin as api/requirements.txt)
        run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Integration test (live; test project only)
        env:
          SEQSIGHT_IT_ENABLE: "1"
          SEQSIGHT_IT_SUPABASE_URL: ${{ secrets.SEQSIGHT_IT_SUPABASE_URL }}
          SEQSIGHT_IT_SUPABASE_SERVICE_KEY: ${{ secrets.SEQSIGHT_IT_SUPABASE_SERVICE_KEY }}
          SEQSIGHT_IT_LSTM_RUN_ID: ${{ vars.SEQSIGHT_IT_LSTM_RUN_ID }}
          SEQSIGHT_IT_ATTENTION_RUN_ID: ${{ vars.SEQSIGHT_IT_ATTENTION_RUN_ID }}
        # -m integration: select only the live test; --tb=short -q keep output small. Failures print run
        # ids and mismatch descriptions, never the URL or key (the helpers never include them).
        run: python -m pytest tests/test_supabase_integration.py -m integration -v --tb=short -p no:cacheprovider
