# Offline CI: no secrets, no network calls to Supabase or the deployed API.
# The credentialed integration test is a separate, manual workflow (integration.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:            # fork PRs run this workflow too; it uses no secrets

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            ui/requirements.txt
            requirements-dev.txt
      - name: Install CPU-only PyTorch (same pin as api/requirements.txt)
        run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline test suite
        env:
          # make sure nothing live is enabled, whatever the runner environment contains
          SEQSIGHT_IT_ENABLE: "0"
        run: python -m pytest -q -rs
